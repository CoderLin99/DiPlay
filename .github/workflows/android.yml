name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: diplay-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html
  release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'CoderLin99/DiPlay'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare private build inputs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MFI_IDENTITY_BASE64: ${{ secrets.DIPLAY_AUTH_IDENTITY_BASE64 }}
          MFI_CERTIFICATE_BASE64: ${{ secrets.DIPLAY_AUTH_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$MFI_IDENTITY_BASE64" && test -n "$MFI_CERTIFICATE_BASE64"
          umask 077
          mkdir -p "$RUNNER_TEMP/diplay-auth/offline-mfi"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/diplay-release.jks"
          printf '%s' "$MFI_IDENTITY_BASE64" | base64 --decode > "$RUNNER_TEMP/diplay-auth/offline-mfi/identity.pk8"
          printf '%s' "$MFI_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/diplay-auth/offline-mfi/certificate.p7b"
      - name: Release lint and signed standalone APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/diplay-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DIPLAY_AUTH_ASSETS_DIR: ${{ runner.temp }}/diplay-auth
        run: ./gradlew :mobile:lintRelease :mobile:assembleRelease --stacktrace
      - name: Verify and package distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/distribution
          version=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mobile/build.gradle.kts | head -1)
          test -n "$version"
          apk="build/distribution/DiPlay-$version.apk"
          cp mobile/build/outputs/apk/release/mobile-release.apk "$apk"
          for name in identity.pk8 certificate.p7b; do
            unzip -p "$apk" "assets/offline-mfi/$name" | cmp - "$RUNNER_TEMP/diplay-auth/offline-mfi/$name"
          done
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > build/distribution/signature.txt
          git archive --format=zip --output="build/distribution/DiPlay-$version-source.zip" HEAD
          printf 'repository=CoderLin99/DiPlay\ncommit=%s\nupstream_release=v0.2.11\nversion=%s\n' "$GITHUB_SHA" "$version" > build/distribution/build-info.txt
          cd build/distribution
          sha256sum *.apk *-source.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-0.2.11-geely.3-release
          path: build/distribution/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral build inputs
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/diplay-release.jks"
          rm -rf "$RUNNER_TEMP/diplay-auth"
